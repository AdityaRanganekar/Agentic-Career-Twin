name: Full-Stack CI/CD Pipeline (Pytest, Vite Build & Production Deploy)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------------
  # JOB 1: Backend Testing & Mathematical Validity Suite
  # --------------------------------------------------------------------------
  backend-test:
    name: Backend Pytest & Mathematical Validity Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install Python Dependencies (fastembed ONNX)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-Cache all-MiniLM-L6-v2 ONNX Embeddings
        run: |
          python -c "from fastembed import TextEmbedding; TextEmbedding(model_name='sentence-transformers/all-MiniLM-L6-v2')"

      - name: Execute Full Test Suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'mock_test_key' }}
          DATABASE_URL: 'sqlite:///./test_ci.db'
          PYTHONPATH: '.'
        run: |
          pytest -v --tb=short

  # --------------------------------------------------------------------------
  # JOB 2: Frontend TypeScript & Vite Production Build Verification
  # --------------------------------------------------------------------------
  frontend-build:
    name: Frontend TypeScript & Vite Production Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Production Bundle (tsc + vite)
        run: npm run build

  # --------------------------------------------------------------------------
  # JOB 3: Continuous Deployment (Render Deploy Hook & Optional Cloud Sync)
  # --------------------------------------------------------------------------
  deploy-production:
    name: Continuous Deployment (Render & Cloud Sync)
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trigger Render Deploy Hook (If Configured)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render automated deployment webhook..."
            curl -X POST -s -S -f "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deploy hook triggered successfully!"
          else
            echo "NOTICE: RENDER_DEPLOY_HOOK_URL secret not configured in GitHub Secrets."
            echo "If your Render Web Service is set to Auto-Deploy (default), Render deploys automatically on push."
          fi

      - name: Deploy to Hugging Face Docker Space (If Configured)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          if [ -n "$HF_TOKEN" ] && [ -n "$HF_USERNAME" ] && [ -n "$HF_SPACE_NAME" ]; then
            echo "Hugging Face credentials detected. Syncing code to Space..."
            git config --global user.email "ci-bot@agentic-career-twin.internal"
            git config --global user.name "Career Twin CI/CD Bot"
            git remote add hf-space "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}"
            git push hf-space HEAD:main --force
            echo "Successfully pushed latest commit to Hugging Face Space."
          fi
